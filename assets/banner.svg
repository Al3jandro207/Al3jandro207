<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05030d"/>
      <stop offset=".55" stop-color="#120a2e"/>
      <stop offset="1" stop-color="#05030d"/>
    </linearGradient>
    <linearGradient id="streakA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95" stop-opacity="0"/>
      <stop offset=".4" stop-color="#8b5cf6"/>
      <stop offset=".75" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset=".5" stop-color="#6366f1" stop-opacity=".2"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif; }
    .flow1 { stroke-dasharray: 380 1400; animation: flow 7s linear infinite; }
    .flow2 { stroke-dasharray: 260 1400; animation: flow 9s linear infinite; animation-delay: -3s; }
    .flow3 { stroke-dasharray: 320 1400; animation: flow 11s linear infinite; animation-delay: -6s; }
    @keyframes flow { from { stroke-dashoffset: 1700; } to { stroke-dashoffset: -100; } }
    .sway { animation: sway 8s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateY(-8px); } to { transform: translateY(10px); } }
    .card { animation: bob 6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    .spark { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
    .ringspin { transform-origin: 200px 150px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .role { opacity: 0; font-size: 18px; fill: #e9d5ff; animation: cycle 12s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      6% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      36% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    .dot { animation: dot 1.6s ease-in-out infinite; }
    @keyframes dot { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .halo { transform-origin: 200px 150px; animation: halo 2.8s ease-out infinite; }
    @keyframes halo { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.5); opacity: 0; } }
    .enter { opacity: 0; animation: enter 1.2s ease-out .2s forwards; }
    @keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .chip { animation: chip 4s ease-in-out infinite; }
    .c2 { animation-delay: .4s; } .c3 { animation-delay: .8s; }
    @keyframes chip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- luces de fondo -->
    <circle cx="140" cy="250" r="130" fill="#7c3aed" opacity=".55" filter="url(#blur40)">
      <animate attributeName="cx" values="140;240;140" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="60" r="120" fill="#2563eb" opacity=".45" filter="url(#blur40)">
      <animate attributeName="cy" values="60;140;60" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="290" r="90" fill="#db2777" opacity=".35" filter="url(#blur40)">
      <animate attributeName="cx" values="560;700;560" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- estelas de luz neon -->
    <g class="sway" fill="none" stroke-linecap="round">
      <path d="M-60 270 C 220 40, 520 330, 1060 40" stroke="url(#streakA)" stroke-width="1.5" opacity=".35"/>
      <path d="M-60 290 C 260 90, 560 340, 1060 90" stroke="url(#streakB)" stroke-width="1.5" opacity=".3"/>
      <path d="M-60 250 C 180 20, 480 300, 1060 10" stroke="url(#streakA)" stroke-width="1" opacity=".25"/>

      <path class="flow1" d="M-60 270 C 220 40, 520 330, 1060 40" stroke="url(#streakA)" stroke-width="3" filter="url(#glow)"/>
      <path class="flow2" d="M-60 290 C 260 90, 560 340, 1060 90" stroke="url(#streakB)" stroke-width="2.5" filter="url(#glow)"/>
      <path class="flow3" d="M-60 250 C 180 20, 480 300, 1060 10" stroke="url(#streakA)" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- particulas -->
    <g fill="#ffffff">
      <circle class="spark" cx="90"  cy="60"  r="1.8" style="animation-delay:0s"/>
      <circle class="spark" cx="300" cy="30"  r="1.4" style="animation-delay:.8s"/>
      <circle class="spark" cx="470" cy="270" r="1.6" style="animation-delay:1.6s"/>
      <circle class="spark" cx="640" cy="28"  r="1.3" style="animation-delay:2.2s"/>
      <circle class="spark" cx="930" cy="230" r="1.8" style="animation-delay:.4s"/>
      <circle class="spark" cx="760" cy="275" r="1.4" style="animation-delay:1.2s"/>
      <circle class="spark" cx="40"  cy="180" r="1.5" style="animation-delay:2.6s"/>
      <circle class="spark" cx="960" cy="110" r="1.3" style="animation-delay:1.9s"/>
    </g>

    <!-- tarjeta de cristal -->
    <g class="enter">
      <g class="card">
        <rect x="100" y="58" width="800" height="184" rx="26" fill="url(#glass)" stroke="url(#glassStroke)" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="102" y="60" width="796" height="60" rx="24" fill="#ffffff" opacity=".04"/>
        <path d="M130 59.5 H 870" stroke="#ffffff" stroke-opacity=".45" stroke-width="1" stroke-linecap="round"/>

        <!-- avatar -->
        <circle class="halo" cx="200" cy="150" r="44" fill="none" stroke="#e879f9" stroke-width="2"/>
        <circle class="ringspin" cx="200" cy="150" r="49" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="190 120" stroke-linecap="round"/>
        <circle cx="200" cy="150" r="42" fill="url(#avatar)"/>
        <text x="200" y="165" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff">A</text>

        <!-- nombre y rol -->
        <text x="272" y="124" font-size="42" font-weight="800" fill="url(#name)">Alejandro</text>
        <text x="274" y="150" font-size="15" fill="#c4b5fd" opacity=".85">@Al3jandro207</text>
        <g>
          <text class="role r1" x="274" y="192">Estudiante del Tecnológico de Antioquia</text>
          <text class="role r2" x="274" y="192">Desarrollador de BarberHome</text>
          <text class="role r3" x="274" y="192">Medellín, Antioquia · Colombia</text>
        </g>

        <!-- chips de tecnologias -->
        <g class="chip">
          <rect x="650" y="96" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".3"/>
          <text x="684" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#ffa657">Java</text>
        </g>
        <g class="chip c2">
          <rect x="726" y="96" width="76" height="30" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".3"/>
          <text x="764" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#79c0ff">Python</text>
        </g>
        <g class="chip c3">
          <rect x="810" y="96" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".3"/>
          <text x="844" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#7ee787">MySQL</text>
        </g>

        <!-- estado -->
        <rect x="650" y="150" width="228" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/>
        <circle class="dot" cx="672" cy="169" r="5" fill="#4ade80"/>
        <text x="688" y="174" font-size="14" fill="#f3e8ff">Construyendo BarberHome</text>

        <!-- barra decorativa de progreso -->
        <rect x="650" y="206" width="228" height="5" rx="2.5" fill="#ffffff" fill-opacity=".12"/>
        <rect x="650" y="206" width="0" height="5" rx="2.5" fill="url(#avatar)">
          <animate attributeName="width" values="0;228;228;0" keyTimes="0;.5;.9;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
